name: Dataset Update

on:
  schedule:
    - cron: '0 6 2 * *'
  workflow_dispatch:
    inputs:
      should_release:
        description: 'Publish to NPM & create GitHub Release'
        required: false
        default: false
        type: boolean

jobs:
  extract:
    runs-on: ubuntu-latest
    outputs:
      source_file: ${{ steps.determine_dump.outputs.filename }}
      checksum: ${{ steps.download_dump.outputs.checksum }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pigz jq

      - name: Determine latest Discogs releases dump filename
        id: determine_dump
        run: |
          set -euo pipefail
          # Capture first so a script failure aborts the step cleanly (with the script's
          # real exit code and stderr) instead of leaving a dangling heredoc delimiter in
          # $GITHUB_OUTPUT. The filename is always a single line, so no heredoc is needed.
          filename="$(scripts/discogs-fetch-data-dump.sh)"
          echo "filename=${filename}" >> "$GITHUB_OUTPUT"

      - name: Download latest Discogs Data Dump for Releases
        id: download_dump
        run: |
          set -euo pipefail
          scripts/discogs-download-data-dump.sh "${{ steps.determine_dump.outputs.filename }}"

      - name: Extract latest genres & styles
        id: extract
        run: |
          set -euo pipefail
          scripts/discogs-extract-genres-styles.sh "${{ steps.determine_dump.outputs.filename }}"

      - name: Housekeeping
        if: always()
        run: |
          set -euo pipefail
          rm -f "${{ steps.determine_dump.outputs.filename }}" discogs_*_CHECKSUM.txt || true

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    needs: extract

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Run tests
        run: npm test

  publish:
    runs-on: ubuntu-latest
    needs: [extract, test]
    permissions:
      contents: write
      id-token: write
    outputs:
      should_release: ${{ steps.publish_changes.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Configure git user
        run: |
          git config --local user.email "${{ vars.GIT_USER_EMAIL }}"
          git config --local user.name "${{ vars.GIT_USER_NAME }}"

      - name: Publish changes upstream
        id: publish_changes
        env:
          SOURCE_FILE: ${{ needs.extract.outputs.source_file }}
          SOURCE_CHECKSUM: ${{ needs.extract.outputs.checksum }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOULD_RELEASE: ${{ github.event_name == 'schedule' || github.event.inputs.should_release == 'true' }}
        run: |
          set -euo pipefail
          .github/scripts/publish.sh "$SOURCE_FILE" "$SHOULD_RELEASE"

      - name: Create GitHub Release using GH CLI
        if: ${{ github.event_name == 'schedule' || github.event.inputs.should_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_FILE: ${{ needs.extract.outputs.source_file }}
        run: |
          set -euo pipefail

          TAG="${{ steps.publish_changes.outputs.tag_name }}"
          NAME="${{ steps.publish_changes.outputs.tag_name }}"
          DATE="${{ steps.publish_changes.outputs.extracted_date }}"

          echo "Creating release $TAG ..."

          gh release create "$TAG" dist/* \
            --title "$NAME" \
            --notes "Automated dataset update.
            Source file: \`${SOURCE_FILE}\`
            Extracted on: ${DATE}
            "
