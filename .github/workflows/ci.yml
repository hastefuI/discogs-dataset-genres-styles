name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Run tests
        run: npm test

      - name: Run the examples
        run: |
          set -euo pipefail
          for example in examples/*.mjs; do
            echo "--- $example"
            node "$example"
          done

      - name: Bundle for the browser
        run: >
          npx --yes esbuild@0.25.0 examples/browser.mjs
          --bundle --platform=browser --outfile=/dev/null

      - name: Type check the declarations
        run: >
          npx --yes typescript@5.7.2 tsc --noEmit --strict --target es2022
          --module nodenext --moduleResolution nodenext test/types.ts
